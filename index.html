<style>
body{background:#000;color:#fff;font-family:"Courier New",monospace;text-align:center;padding:10vh 5vw;line-height:2.2;-webkit-user-select:none;user-select:none}
canvas{max-width:100%;height:auto;margin:3em 0}
.h{color:#333;font-size:.8em}
.d{opacity:.35}
</style>
</head>
<body oncontextmenu="return false">
<!-- nada aqui que você já não saiba. -->
<p>Você chegou até aqui.</p>
<p>Poucos chegam.</p>
<p class="d">Um cupim não derruba a casa de uma vez.</p>
<p class="d">Ele começa pela superfície.</p>
<canvas id="k" width="1000" height="330"></canvas>
<p class="h">Batidas na parede. Cinco por cinco.</p>
<p class="h">Um diplomata francês do século XVI guarda esta porta.</p>
<p class="h">A palavra que abriu a primeira porta serve de novo, mas volta de costas.</p>
<p>2711</p>
<script>
var t="MXGIZUUPJQDBPYUFICIUAU",g="ABCDEFGHIJLMNOPQRSTUVWXYZ",W=1000,H=330,lines=[],i,j;
var c=document.getElementById("k"),x=c.getContext("2d");
x.fillStyle="#000";x.fillRect(0,0,W,H);
for(i=0;i<t.length;i+=6)lines.push(t.slice(i,i+6));
lines.forEach(function(L,n){
var q=[],w=0;
for(i=0;i<L.length;i++){var p=g.indexOf(L[i]);q.push([Math.floor(p/5)+1,p%5+1]);w+=(q[i][0]-1)*14+(q[i][1]-1)*14+22+(i?34:0)}
var px=(W-w)/2,y=40+n*78;
q.forEach(function(r){
for(j=0;j<r[0];j++){x.beginPath();x.arc(px+j*14,y,5,0,7);x.fillStyle="#fff";x.fill()}
px+=(r[0]-1)*14+22;
for(j=0;j<r[1];j++){x.beginPath();x.arc(px+j*14,y,5,0,7);x.fillStyle="#fff";x.fill()}
px+=(r[1]-1)*14+34;
});
});
for(i=0;i<120;i++){x.fillStyle="rgba(255,255,255,"+Math.random()*.1+")";x.fillRect(Math.random()*W,Math.random()*H,1,1)}
</script>
</body>
