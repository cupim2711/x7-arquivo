<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>// 2711 // III</title>
<style>
body{background:#000;color:#fff;font-family:"Courier New",monospace;text-align:center;padding:4vh 6vw;line-height:2;-webkit-user-select:none;user-select:none}
canvas{max-width:100%;height:auto;margin:1em 0}
.h{color:#333;font-size:.8em}
.d{opacity:.35}
</style>
</head>
<body oncontextmenu="return false">
<p>Você desceu.</p>
<p class="d">Aqui embaixo ninguém fala a nossa língua.</p>
<canvas id="b" width="360" height="500"></canvas>
<p class="h">Luz acesa. Luz apagada. Oito em oito.</p>
<p class="h">Tabela de 1963.</p>
<p>2711</p>
<script>
var w = "CAMARA.HTML";
var c = document.getElementById("b");
var x = c.getContext("2d");

// Limpa o canvas com fundo preto
x.fillStyle = "#000";
x.fillRect(0, 0, c.width, c.height);

// Desenha cada caractere em 8 bits (linhas)
for (var r = 0; r < w.length; r++) {
    var bits = ("00000000" + w.charCodeAt(r).toString(2)).slice(-8);
    
    for (var i = 0; i < 8; i++) {
        var on = bits[i] === "1";
        var px = 20 + i * 40;  // Coluna (bit)
        var py = 15 + r * 42;  // Linha (caractere) com espaçamento ideal
        
        x.fillStyle = on ? "#fff" : "#101010";
        x.fillRect(px, py, 32, 32);
        
        if (!on) {
            x.strokeStyle = "#222";
            x.strokeRect(px + 0.5, py + 0.5, 31, 31);
        }
    }
}
</script>
</body>
</html>
