<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>// 2711 // III</title>
<style>
body{background:#000;color:#fff;font-family:"Courier New",monospace;text-align:center;padding:5vh 6vw;line-height:2.2;-webkit-user-select:none;user-select:none}
canvas{max-width:100%;height:auto;margin:1.5em 0}
.h{color:#333;font-size:.8em}
.d{opacity:.35}
</style>
</head>
<body oncontextmenu="return false">
<p>Você desceu.</p>
<p class="d">Aqui embaixo ninguém fala a nossa língua.</p>
<canvas id="b" width="360" height="460"></canvas>
<p class="h">Luz acesa. Luz apagada. Oito em oito.</p>
<p class="h">Tabela de 1963.</p>
<p>2711</p>
<script>
var w = "CAMARA.HTML";
var c = document.getElementById("b");
var x = c.getContext("2d");

// Fundo do Canvas
x.fillStyle = "#000";
x.fillRect(0, 0, c.width, c.height);

// Renderização dos 8 bits para cada caractere de "CAMARA.HTML"
for (var r = 0; r < w.length; r++) {
    // Converte a letra para o valor ASCII/UTF-8 em binário (8 bits)
    var bits = ("00000000" + w.charCodeAt(r).toString(2)).slice(-8);
    
    for (var i = 0; i < 8; i++) {
        var on = bits[i] === "1";
        var px = 20 + i * 40;  // Posição X (coluna/bit)
        var py = 10 + r * 40;  // Posição Y (linha/letra)
        
        // Desenha os blocos acesos (#fff) ou apagados (#101010)
        x.fillStyle = on ? "#fff" : "#101010";
        x.fillRect(px, py, 28, 28);
        
        if (!on) {
            x.strokeStyle = "#222";
            x.strokeRect(px + 0.5, py + 0.5, 27, 27);
        }
    }
}
</script>
</body>
</html>
